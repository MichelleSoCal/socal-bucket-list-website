<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Port of San Diego Cruises - SoCal Bucket List</title>
    <meta name="description" content="Discover cruise lines departing from Port of San Diego. Find your next adventure at sea.">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://socalbucketlist.com/cruises/ports/san-diego.html">
    <meta property="og:title" content="Port of San Diego Cruises - SoCal Bucket List">
    <meta property="og:description" content="Discover cruise lines departing from Port of San Diego. Find your next adventure at sea.">

    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #1a0a1f 0%, #2d1b3d 50%, #1a0a1f 100%);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Header */
        .header {
            background: rgba(26, 10, 31, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 110, 199, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s ease;
        }

        .logo-link:hover {
            opacity: 0.8;
        }

        .header-logo {
            height: 70px;
            width: auto;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            color: #ff6ec7;
            background: rgba(255, 110, 199, 0.1);
        }

        /* Port Header Section */
        .port-header {
            padding: 80px 40px 60px;
            text-align: left;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            border-bottom: 1px solid rgba(255, 110, 199, 0.2);
        }

        .port-header-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .port-header-content > div:first-child {
            font-size: 1.1rem;
            color: #ff6ec7;
            margin-bottom: 10px;
        }

        .port-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .port-header p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .beta-disclaimer {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
            font-style: italic;
        }

        /* Cruise Lines Section */
        .cruise-lines-section {
            padding: 60px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ff6ec7 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Cruise Line Cards */
        .cruise-lines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .cruise-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 110, 199, 0.2);
            border-radius: 16px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .cruise-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cruise-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 110, 199, 0.4);
            box-shadow: 0 8px 32px rgba(255, 110, 199, 0.2);
        }

        .cruise-card:hover::before {
            opacity: 1;
        }

        .cruise-card-content {
            position: relative;
            z-index: 1;
        }

        .cruise-line-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            text-align: center;
        }

        .cruise-website-link {
            display: block;
            margin-top: 15px;
            color: #ff6ec7;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        .cruise-website-link:hover {
            color: #ff9bd5;
            text-decoration: underline;
        }

        .cruise-line-logo {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #ff6ec7;
            font-size: 1.1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .site-name {
                font-size: 1.2rem;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 0.9rem;
                padding: 6px 12px;
            }

            .port-header {
                padding: 60px 20px 40px;
            }

            .port-header h1 {
                font-size: 2rem;
            }

            #port-photo {
                width: 120px !important;
                height: 120px !important;
            }

            .cruise-lines-section {
                padding: 40px 20px;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .cruise-lines-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Port Header -->
    <section class="port-header">
        <div class="port-header-content">
            <div style="display: flex; align-items: center; gap: 30px;">
                <img id="port-photo" src="" alt="Port of San Diego" style="width: 220px; height: 220px; border-radius: 12px; object-fit: cover; object-position: center; border: 2px solid rgba(255, 110, 199, 0.3); display: none;">
                <div>
                    <div>San Diego, California</div>
                    <h1>Port of San Diego</h1>
                    <p>Discover cruise lines departing from San Diego, California</p>
                    <p class="beta-disclaimer">For dreaming purposes only. Please verify cruise availability before making travel plans.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Cruise Lines Section -->
    <section class="cruise-lines-section">
        <h2 class="section-title">Cruise Lines Departing from San Diego <span style="font-size: 0.5em; background: rgba(255, 110, 199, 0.3); padding: 4px 10px; border-radius: 12px; vertical-align: middle; margin-left: 8px;">BETA</span></h2>
        <div class="cruise-lines-grid" id="cruise-lines-grid">
            <div class="loading">Loading cruise lines...</div>
        </div>
    </section>

    <script>
        // Airtable configuration
        const AIRTABLE_TOKEN = 'pat4HICXlDN0QBxkZ.b8d2092207dd1ee3ec676ab0b131f19ae92d17bcc17b0c9fb25d0a64dd1e0024';
        const AIRTABLE_BASE_ID = 'appGoQsy2UiGyyZ3T';
        const PORT_NAME = 'Port of San Diego';

        async function fetchAllRecords(tableName) {
            let records = [];
            let offset = null;

            do {
                const url = offset
                    ? `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}?offset=${offset}`
                    : `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` }
                });

                if (!response.ok) throw new Error(`Failed to fetch ${tableName}`);

                const data = await response.json();
                records = records.concat(data.records);
                offset = data.offset;
            } while (offset);

            return records;
        }

        async function loadCruiseLines() {
            const grid = document.getElementById('cruise-lines-grid');

            try {
                // Fetch all tables
                const [cruisePorts, cruiseLines] = await Promise.all([
                    fetchAllRecords('Cruise_Ports'),
                    fetchAllRecords('Cruise_Lines')
                ]);

                // Find Port of San Diego record
                const sanDiegoPort = cruisePorts.find(port =>
                    port.fields.Cruise_Port === PORT_NAME
                );

                if (!sanDiegoPort) {
                    grid.innerHTML = '<div class="error">Port of San Diego not found in database.</div>';
                    return;
                }

                // Display port photo if available
                const portPhoto = sanDiegoPort.fields.Port_Photo && sanDiegoPort.fields.Port_Photo[0]
                    ? sanDiegoPort.fields.Port_Photo[0].url
                    : null;

                if (portPhoto) {
                    const portPhotoElement = document.getElementById('port-photo');
                    portPhotoElement.src = portPhoto;
                    portPhotoElement.style.display = 'block';
                }

                // Get cruise line IDs that have San Diego as a departure port
                const cruiseLinesForPort = cruiseLines.filter(line => {
                    const departurePorts = line.fields.Departure_Port || [];
                    return departurePorts.includes(sanDiegoPort.id);
                });

                if (cruiseLinesForPort.length === 0) {
                    grid.innerHTML = '<div class="error">No cruise lines found for Port of San Diego.</div>';
                    return;
                }

                // Create cruise line cards
                grid.innerHTML = cruiseLinesForPort.map(line => {
                    const cruiseLineName = line.fields.Cruise_Line || 'Unknown Cruise Line';
                    const photo = line.fields.Cruise_Photo && line.fields.Cruise_Photo[0]
                        ? line.fields.Cruise_Photo[0].url
                        : '../../optimized-images/cruise-default.png';
                    const website = line.fields.Official_Website || null;

                    return `
                        <div class="cruise-card">
                            <div class="cruise-card-content">
                                <img src="${photo}" alt="${cruiseLineName}" class="cruise-line-logo">
                                <div class="cruise-line-name">${cruiseLineName}</div>
                                ${website ? `<a href="${website}" target="_blank" rel="noopener noreferrer" class="cruise-website-link">${cruiseLineName} Website</a>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading cruise lines:', error);
                grid.innerHTML = '<div class="error">Failed to load cruise lines. Please try again later.</div>';
            }
        }

        // Load cruise lines when page loads
        loadCruiseLines();
    </script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../../components/loader.js"></script>
</body>
</html>
