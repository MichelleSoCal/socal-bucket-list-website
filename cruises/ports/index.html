<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics Manager -->
    <script src="../../components/consent.js"></script>
    <!-- Caching System -->
    <script src="../../components/cache.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoCal Cruise Ports | SoCal Bucket List</title>
    <meta name="description" content="Discover cruise ports in Southern California. Find cruise lines departing from San Diego, Los Angeles, and Long Beach.">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://socalbucketlist.com/cruises/">
    <meta property="og:title" content="SoCal Cruise Ports | SoCal Bucket List">
    <meta property="og:description" content="Discover cruise ports in Southern California. Find cruise lines departing from San Diego, Los Angeles, and Long Beach.">

    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #1a0a1f 0%, #2d1b3d 50%, #1a0a1f 100%);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Page Header */
        .page-header {
            padding: 80px 40px 60px;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            border-bottom: 1px solid rgba(255, 110, 199, 0.2);
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .beta-disclaimer {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            font-style: italic;
        }

        /* Ports Section */
        .ports-section {
            padding: 60px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ff6ec7 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Port Cards */
        .ports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .port-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 110, 199, 0.2);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .port-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .port-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 110, 199, 0.4);
            box-shadow: 0 8px 32px rgba(255, 110, 199, 0.2);
        }

        .port-card:hover::before {
            opacity: 1;
        }

        .port-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: center;
        }

        .port-card-content {
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .port-location {
            font-size: 0.9rem;
            color: #ff6ec7;
            margin-bottom: 8px;
        }

        .port-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .port-info {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .cruise-lines-count {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255, 110, 199, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ff6ec7;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #ff6ec7;
            font-size: 1.1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .page-header {
                padding: 60px 20px 40px;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .ports-section {
                padding: 40px 20px;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .ports-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Southern California Cruise Ports <span style="font-size: 0.5em; background: rgba(255, 110, 199, 0.3); padding: 4px 12px; border-radius: 12px; vertical-align: middle; margin-left: 8px;">BETA</span></h1>
        <p>Explore cruise lines departing from SoCal's major cruise terminals</p>
        <p class="beta-disclaimer">For dreaming purposes only. Please verify cruise availability before making travel plans.</p>
    </section>

    <!-- Ports Section -->
    <section class="ports-section">
        <div class="ports-grid" id="ports-grid">
            <div class="loading">Loading cruise ports...</div>
        </div>
    </section>

    <script>
        // Airtable configuration
        const AIRTABLE_TOKEN = 'pat4HICXlDN0QBxkZ.b8d2092207dd1ee3ec676ab0b131f19ae92d17bcc17b0c9fb25d0a64dd1e0024';
        const AIRTABLE_BASE_ID = 'appGoQsy2UiGyyZ3T';

        // Port mapping to page URLs
        const PORT_PAGES = {
            'Port of San Diego': 'san-diego.html',
            'Port of Los Angeles': 'los-angeles.html',
            'Port of Long Beach': 'long-beach.html'
        };

        async function fetchAllRecords(tableName) {
            let records = [];
            let offset = null;

            do {
                const url = offset
                    ? `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}?offset=${offset}`
                    : `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` }
                });

                if (!response.ok) throw new Error(`Failed to fetch ${tableName}`);

                const data = await response.json();
                records = records.concat(data.records);
                offset = data.offset;
            } while (offset);

            return records;
        }

        async function loadPorts() {
            const grid = document.getElementById('ports-grid');

            try {
                // Fetch all tables
                const [cruisePorts, cruiseLines] = await Promise.all([
                    fetchAllRecords('Cruise_Ports'),
                    fetchAllRecords('Cruise_Lines')
                ]);

                // Filter to only SoCal ports we have pages for
                const socalPorts = cruisePorts.filter(port =>
                    PORT_PAGES.hasOwnProperty(port.fields.Cruise_Port)
                );

                if (socalPorts.length === 0) {
                    grid.innerHTML = '<div class="error">No cruise ports found.</div>';
                    return;
                }

                // Create port cards
                grid.innerHTML = socalPorts.map(port => {
                    const portName = port.fields.Cruise_Port || 'Unknown Port';

                    // Map port names to locations
                    let location = 'California';
                    if (portName === 'Port of San Diego') {
                        location = 'San Diego, California';
                    } else if (portName === 'Port of Los Angeles') {
                        location = 'Los Angeles, California';
                    } else if (portName === 'Port of Long Beach') {
                        location = 'Long Beach, California';
                    }

                    const photo = port.fields.Port_Photo && port.fields.Port_Photo[0]
                        ? port.fields.Port_Photo[0].url
                        : '../optimized-images/cruise-default.png';

                    // Count cruise lines for this port
                    const cruiseLinesCount = cruiseLines.filter(line => {
                        const departurePorts = line.fields.Departure_Port || [];
                        return departurePorts.includes(port.id);
                    }).length;

                    const pageUrl = PORT_PAGES[portName] || '#';

                    return `
                        <a href="${pageUrl}" class="port-card">
                            <img src="${photo}" alt="${portName}" class="port-image">
                            <div class="port-card-content">
                                <div class="port-location">${location}</div>
                                <div class="port-name">${portName}</div>
                                <div class="port-info">Explore cruise lines departing from this port</div>
                                <span class="cruise-lines-count">${cruiseLinesCount} Cruise Line${cruiseLinesCount !== 1 ? 's' : ''}</span>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading ports:', error);
                grid.innerHTML = '<div class="error">Failed to load cruise ports. Please try again later.</div>';
            }
        }

        // Load ports when page loads
        loadPorts();
    </script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../../components/loader.js"></script>
</body>
</html>
