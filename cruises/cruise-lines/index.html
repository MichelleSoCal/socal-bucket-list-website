<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cookie Consent & Analytics Manager -->
    <script src="../../components/consent.js"></script>
    <!-- Caching System -->
    <script src="../../components/cache.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoCal Cruise Lines | SoCal Bucket List</title>
    <meta name="description" content="Discover cruise lines departing from Southern California. Find cruise lines from San Diego, Los Angeles, and Long Beach.">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://socalbucketlist.com/cruises/cruise-lines/">
    <meta property="og:title" content="SoCal Cruise Lines | SoCal Bucket List">
    <meta property="og:description" content="Discover cruise lines departing from Southern California. Find cruise lines from San Diego, Los Angeles, and Long Beach.">

    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #1a0a1f 0%, #2d1b3d 50%, #1a0a1f 100%);
            color: #fff;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Page Header */
        .page-header {
            padding: 80px 40px 60px;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            border-bottom: 1px solid rgba(255, 110, 199, 0.2);
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .beta-disclaimer {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            font-style: italic;
        }

        /* Cruise Lines Section */
        .cruise-lines-section {
            padding: 60px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
            background: linear-gradient(135deg, #ff6ec7 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Cruise Line Cards */
        .cruise-lines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .cruise-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 110, 199, 0.2);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .cruise-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 110, 199, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .cruise-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 110, 199, 0.4);
            box-shadow: 0 8px 32px rgba(255, 110, 199, 0.2);
        }

        .cruise-card:hover::before {
            opacity: 1;
        }

        .cruise-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: center;
        }

        .cruise-card-content {
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .cruise-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .cruise-ports {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .port-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 110, 199, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #ff6ec7;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #ff6ec7;
            font-size: 1.1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .page-header {
                padding: 60px 20px 40px;
            }

            .page-header h1 {
                font-size: 2rem;
            }

            .cruise-lines-section {
                padding: 40px 20px;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .cruise-lines-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Page Header -->
    <section class="page-header">
        <h1>Southern California Cruise Lines <span style="font-size: 0.5em; background: rgba(255, 110, 199, 0.3); padding: 4px 12px; border-radius: 12px; vertical-align: middle; margin-left: 8px;">BETA</span></h1>
        <p>Explore cruise lines departing from SoCal's major cruise terminals</p>
        <p class="beta-disclaimer">For dreaming purposes only. Please verify cruise availability before making travel plans.</p>
    </section>

    <!-- Cruise Lines Section -->
    <section class="cruise-lines-section">
        <div class="cruise-lines-grid" id="cruise-lines-grid">
            <div class="loading">Loading cruise lines...</div>
        </div>
    </section>

    <script>
        // Airtable configuration
        const AIRTABLE_TOKEN = 'pat4HICXlDN0QBxkZ.b8d2092207dd1ee3ec676ab0b131f19ae92d17bcc17b0c9fb25d0a64dd1e0024';
        const AIRTABLE_BASE_ID = 'appGoQsy2UiGyyZ3T';

        // Port name mapping
        const PORT_DISPLAY_NAMES = {
            'Port of San Diego': 'San Diego',
            'Port of Los Angeles': 'Los Angeles',
            'Port of Long Beach': 'Long Beach'
        };

        async function fetchAllRecords(tableName) {
            let records = [];
            let offset = null;

            do {
                const url = offset
                    ? `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}?offset=${offset}`
                    : `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${tableName}`;

                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` }
                });

                if (!response.ok) throw new Error(`Failed to fetch ${tableName}`);

                const data = await response.json();
                records = records.concat(data.records);
                offset = data.offset;
            } while (offset);

            return records;
        }

        async function loadCruiseLines() {
            const grid = document.getElementById('cruise-lines-grid');

            try {
                // Fetch all tables
                const [cruisePorts, cruiseLines] = await Promise.all([
                    fetchAllRecords('Cruise_Ports'),
                    fetchAllRecords('Cruise_Lines')
                ]);

                // Create port lookup map
                const portsMap = {};
                cruisePorts.forEach(port => {
                    portsMap[port.id] = port.fields.Cruise_Port;
                });

                // Filter to cruise lines that depart from SoCal
                const socalCruiseLines = cruiseLines.filter(line => {
                    const departurePorts = line.fields.Departure_Port || [];
                    return departurePorts.length > 0;
                });

                // Sort by Display_Order, then alphabetically
                socalCruiseLines.sort((a, b) => {
                    const orderA = a.fields.Display_Order;
                    const orderB = b.fields.Display_Order;

                    if (orderA !== undefined && orderB !== undefined) {
                        return orderA - orderB;
                    }
                    if (orderA !== undefined && orderB === undefined) {
                        return -1;
                    }
                    if (orderA === undefined && orderB !== undefined) {
                        return 1;
                    }

                    const nameA = (a.fields.Cruise_Line || '').toLowerCase();
                    const nameB = (b.fields.Cruise_Line || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                if (socalCruiseLines.length === 0) {
                    grid.innerHTML = '<div class="error">No cruise lines found.</div>';
                    return;
                }

                // Create cruise line cards
                grid.innerHTML = socalCruiseLines.map(line => {
                    const cruiseLineName = line.fields.Cruise_Line || 'Unknown Cruise Line';
                    const photo = line.fields.Cruise_Photo && line.fields.Cruise_Photo[0]
                        ? line.fields.Cruise_Photo[0].url
                        : '../../optimized-images/cruise-default.png';

                    // Get departure ports
                    const departurePorts = line.fields.Departure_Port || [];
                    const portNames = departurePorts
                        .map(portId => portsMap[portId])
                        .filter(Boolean)
                        .map(portName => PORT_DISPLAY_NAMES[portName] || portName);

                    // Determine link
                    const pageUrl = line.fields.Page_URL;
                    const website = line.fields.Official_Website;
                    const href = pageUrl || website || '#';
                    const target = pageUrl ? '_self' : '_blank';
                    const rel = pageUrl ? '' : 'noopener noreferrer';

                    return `
                        <a href="${href}" target="${target}" ${rel ? `rel="${rel}"` : ''} class="cruise-card">
                            <img src="${photo}" alt="${cruiseLineName}" class="cruise-image">
                            <div class="cruise-card-content">
                                <div class="cruise-name">${cruiseLineName}</div>
                                <div class="cruise-ports">
                                    ${portNames.map(name => `<span class="port-badge">${name}</span>`).join('')}
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (error) {
                console.error('Error loading cruise lines:', error);
                grid.innerHTML = '<div class="error">Failed to load cruise lines. Please try again later.</div>';
            }
        }

        // Load cruise lines when page loads
        loadCruiseLines();
    </script>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="../../components/loader.js"></script>
</body>
</html>
