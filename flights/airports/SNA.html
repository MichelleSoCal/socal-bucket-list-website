<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flights from John Wayne Airport (SNA) | SoCal Bucket List</title>
    <meta name="description" content="Discover direct flights from John Wayne Airport in Orange County. Find your next adventure from SNA.">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #1a0a1f 0%, #2d1b3d 50%, #1a0a1f 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Header */
        header {
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            height: 60px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 30px;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff6ec7;
        }

        /* Filter Section */
        .filter-section {
            padding: 30px 50px;
            background: rgba(163, 25, 132, 0.1);
            border-bottom: 1px solid rgba(255, 110, 199, 0.2);
        }

        .filter-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-controls label {
            font-size: 1rem;
            margin-right: 10px;
        }

        .filter-controls select {
            padding: 10px 15px;
            font-size: 1rem;
            border: 1px solid rgba(255, 110, 199, 0.3);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            cursor: pointer;
        }

        /* Flights Section */
        .flights-section {
            padding: 40px 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ff6ec7 0%, #ff9a56 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .flights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .flight-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 110, 199, 0.2);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .flight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 110, 199, 0.3);
            border-color: rgba(255, 110, 199, 0.5);
        }

        .destination-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff6ec7;
            text-transform: uppercase;
        }

        .flight-route {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .airlines {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .airline-tag {
            padding: 4px 12px;
            background: rgba(255, 110, 199, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .flight-details {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Footer */
        footer {
            background: rgba(0, 0, 0, 0.3);
            padding: 40px 50px;
            text-align: center;
            margin-top: 60px;
        }

        footer a {
            color: #ff6ec7;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 20px;
            }

            nav {
                margin-top: 20px;
            }

            nav a {
                margin: 0 15px;
                font-size: 0.9rem;
            }

            .filter-section {
                padding: 20px;
            }

            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .flights-section {
                padding: 30px 20px;
            }

            .flights-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <a href="../../index.html">
            <img src="../../optimized-images/logo-white.png" alt="SoCal Bucket List" class="logo">
        </a>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="../">All Flights</a>
            <a href="./">Airports</a>
        </nav>
    </header>

    <!-- Page Title -->
    <section style="padding: 40px 50px 20px;">
        <div style="display: flex; align-items: center; gap: 30px; max-width: 1400px; margin: 0 auto;">
            <img src="../../optimized-images/john-wayne-airport.jpg" alt="John Wayne Airport" style="width: 150px; height: 150px; border-radius: 12px; object-fit: cover; object-position: right center; border: 2px solid rgba(255, 110, 199, 0.3);">
            <div>
                <div style="font-size: 1.1rem; color: #ff6ec7; margin-bottom: 10px;">SNA - Orange County</div>
                <h1 style="font-size: 2.5rem; margin-bottom: 10px;">John Wayne Airport</h1>
                <p style="font-size: 1rem; color: rgba(255, 255, 255, 0.7);">Discover direct flights from Orange County's premier airport</p>
                <p style="font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); margin-top: 8px; font-style: italic;">For dreaming purposes only. Please verify flights before making plans.</p>
            </div>
        </div>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-controls">
            <label>Filter by:</label>
            <select id="airline-filter">
                <option value="">All Airlines</option>
            </select>
            <select id="state-filter">
                <option value="">All States</option>
            </select>
            <select id="country-filter">
                <option value="">All Countries</option>
            </select>
            <select id="sort-filter">
                <option value="shortest">Shortest Flight Time</option>
                <option value="longest">Longest Flight Time</option>
            </select>
        </div>
    </section>

    <!-- Flights Section -->
    <section class="flights-section">
        <h2 class="section-title">Direct Flights to/from John Wayne Airport <span style="font-size: 0.5em; background: rgba(255, 110, 199, 0.3); padding: 4px 10px; border-radius: 12px; vertical-align: middle; margin-left: 8px;">BETA</span></h2>
        <div class="flights-grid" id="flights-grid">
            <div class="loading">Loading flights...</div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SoCal Bucket List. <a href="../../index.html">Home</a></p>
    </footer>

        // Set which airport this page is for
        window.AIRPORT_CODE = 'SNA';
    </script>

</body>
</html>
